    let currentWord = "", currentMode = 'practice', currentSentence = "";

    }

    async function addGlobalXP(amount) {
        let currentXP = parseInt(localStorage.getItem('jovan_total_xp')) || 0;

window.speakWord = function() { 
    if (!currentWord) return;

    // 1. 先清空之前嘅語音隊列，防止重疊
    window.speechSynthesis.cancel();

    // 2. 核心修正：用 .replace() 將底線換成實際嘅字
    // 咁樣語音引擎就會讀「公園入面有鞦韆」而唔係「下劃線園入面...」
    const naturalSentence = currentSentence.replace(/____/g, currentWord);
    
    // 3. 組合要讀嘅內容
    const textToSpeak = currentMode === 'dictation' ? `${currentWord}。句子係：${naturalSentence}` : currentWord;
    
    const msg = new SpeechSynthesisUtterance(textToSpeak);
    
    // 4. 設定語言同語速
    msg.lang = 'zh-HK'; 
    msg.rate = 0.7; // 維持稍慢嘅語速，方便小朋友聽清楚
    
    // 5. 正式朗讀
    window.speechSynthesis.speak(msg); 
};

    window.revealHint = function() { 
        if (currentMode === 'dictation') { 
            document.getElementById('targetWord').innerText = currentWord; 
            document.getElementById('targetWord').style.color = "#FFFF55"; 
            isHintRevealed = true; streak = 0; updateComboUI();
        } 
    };

        initHero();
        isXpAwarded = false;
        const currentData = wordBank[Math.floor(Math.random() * wordBank.length)];

        currentSentence = currentData.s;
        isHintRevealed = false;
        const targetWordEl = document.getElementById('targetWord');

        if (currentMode === 'dictation') {
            targetWordEl.innerText = "???"; tCanvasEl.style.opacity = "0";

            safeUpdateText('message', "練習模式，加油！");
            safeUpdateText('promptText', "請寫出：");
        }
        tCtx.clearRect(0, 0, 320, 320); tCtx.fillStyle = "#cccccc"; tCtx.font = "220px " + kaitiFont; tCtx.textAlign = "center"; tCtx.textBaseline = "middle"; tCtx.fillText(currentWord, 160, 165);

    window.checkWriting = function() {
        const tD = tCtx.getImageData(0, 0, 320, 320).data;
        const dD = dCtx.getImageData(0, 0, 320, 320).data;
        function getBounds(data) {
            let minX = 320, minY = 320, maxX = 0, maxY = 0, pCount = 0;
            let found = false;
            for (let y = 0; y < 320; y++) {
                for (let x = 0; x < 320; x++) {
                    if (data[(y * 320 + x) * 4 + 3] > 20) {
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                        found = true; pCount++;
                    }
                }
            }
            return found ? { x: minX, y: minY, w: maxX - minX, h: maxY - minY, pCount: pCount } : null;
        }
        const tBounds = getBounds(tD);
        const dBounds = getBounds(dD);
        if (!dBounds) { safeUpdateText('message', "你仲未寫字喎！"); return; }
        const gridSize = 50;
        let matches = 0, totalT = 0, extraPixels = 0;
        for (let gy = 0; gy < gridSize; gy++) {
            for (let gx = 0; gx < gridSize; gx++) {
                const tx = tBounds.x + Math.floor(gx * tBounds.w / gridSize);
                const ty = tBounds.y + Math.floor(gy * tBounds.h / gridSize);
                const dx = dBounds.x + Math.floor(gx * dBounds.w / gridSize);
                const dy = dBounds.y + Math.floor(gy * dBounds.h / gridSize);
                const isT = tD[(ty * 320 + tx) * 4 + 3] > 20;
                const isD = dD[(dy * 320 + dx) * 4 + 3] > 20;
                if (isT) { totalT++; if (isD) matches++; }
                else if (isD) { extraPixels++; }
            }
        }
        const matchScore = (matches / totalT) * 100;
        const dDensity = dBounds.pCount / (dBounds.w * dBounds.h);
        const isScribble = dDensity > 0.65;
        const penalty = (extraPixels / (gridSize * gridSize - totalT)) * 100 * 0.35;
        const finalScore = Math.max(0, Math.round(matchScore - penalty));
        const threshold = (currentMode === 'dictation') ? 35 : 50;

        if (finalScore >= threshold && !isScribble) {
            safeUpdateText('message', `結構好準！${finalScore}% 相似！💎`);
            document.getElementById('steve-reward').classList.add('show-steve');
            if (!isXpAwarded) {
                if (currentMode === 'dictation') {
                    if (!isHintRevealed) { dictationCorrect++; safeUpdateText('dictationCount', dictationCorrect); streak++; addGlobalXP(3); } 
                    else { streak = 0; }
                } else { practiceCorrect++; safeUpdateText('practiceCount', practiceCorrect); streak = 0; addGlobalXP(1); }
                xp += 20; if (xp >= 100) { level++; xp = 0; safeUpdateText('xp-text', "LEVEL UP!"); }
                isXpAwarded = true;
            }
            updateXPUI(); updateComboUI();
            if (streak >= 5) triggerTNT();
            speakWord();
            setTimeout(() => { if(confirm("大勝利！下一個？")) initGame(); }, 1200);
        } else {
            if (isScribble) safeUpdateText('message', `唔好塗黑呀！要寫出字嘅形狀！`);
            else safeUpdateText('message', `得 ${finalScore}%... 再試下寫好啲！`);
            streak = 0; updateComboUI();
        }
    };

    function setupDrawing() {
        dCtx.strokeStyle = "#222"; dCtx.lineWidth = 18; dCtx.lineCap = "round"; dCtx.lineJoin = "round";
        const getPos = (e) => {
            const rect = dCanvas.getBoundingClientRect();
            const cx = (e.clientX || (e.touches && e.touches[0].clientX));
            const cy = (e.clientY || (e.touches && e.touches[0].clientY));
            return { x: cx - rect.left, y: cy - rect.top };
        };
        const start = (e) => { drawing = true; const p = getPos(e); dCtx.beginPath(); dCtx.moveTo(p.x, p.y); };
        const move = (e) => { if (!drawing) return; const p = getPos(e); dCtx.lineTo(p.x, p.y); dCtx.stroke(); if(e.cancelable) e.preventDefault(); };
        const stop = () => { drawing = false; };
        dCanvas.onmousedown = dCanvas.ontouchstart = start; window.onmousemove = window.ontouchmove = move; window.onmouseup = window.ontouchend = stop;
    }

    function updateXPUI() { const bar = document.getElementById('xp-bar'); if(bar) bar.style.width = xp + "%"; }
    function updateComboUI() {
        const tntBox = document.getElementById('tnt-box');
        if (streak > 0) { if(tntBox) tntBox.style.display = 'block'; safeUpdateText('comboText', "COMBO x" + streak); }
        else { if(tntBox) tntBox.style.display = 'none'; }
    }
    function triggerTNT() {
        const tnt = document.getElementById('tntImg'); if(tnt) tnt.classList.add('exploding');
        safeUpdateText('message', "💥 BOOM! 5-COMBO 獎勵！ 💥");
        spawnDiamonds(); addGlobalXP(5);
        setTimeout(() => { if(tnt) tnt.classList.remove('exploding'); streak = 0; updateComboUI(); }, 1000);
    }
    function spawnDiamonds() {
        for (let i = 0; i < 30; i++) {
            setTimeout(() => {
                const d = document.createElement('div');
                d.innerHTML = "💎"; d.style.position = "fixed"; d.style.top = "-50px"; d.style.left = Math.random() * 100 + "vw"; d.style.fontSize = "30px";
                d.style.zIndex = "3000"; d.style.transition = "transform 2s linear, opacity 2s";
                document.body.appendChild(d);
                setTimeout(() => { d.style.transform = "translateY(110vh) rotate(360deg)"; d.style.opacity = "0"; }, 100);
                setTimeout(() => d.remove(), 2500);
            }, i * 100);
        }
    }
    // 改用呢個方式啟動，保證 Module 載入後即刻執行
    initGame();
</script>
