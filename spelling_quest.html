<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jovan's Spelling Quest: RPG Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-dirt: #5c3c21;
            --mc-stone: #777777;
            --mc-grass: #55ff55;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
        }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--mc-dirt);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png'); /* 增加質感 */
            color: white; text-align: center; padding: 10px; margin: 0;
            image-rendering: pixelated;
        }

        /* Minecraft GUI 容器 */
        .gui-panel {
            background-color: var(--mc-gui);
            border: 4px solid var(--mc-border-dark);
            border-right-color: var(--mc-border-light);
            border-bottom-color: var(--mc-border-light);
            box-shadow: inset 4px 4px 0px var(--mc-border-light), inset -4px -4px 0px var(--mc-border-dark);
            max-width: 600px; margin: 10px auto; padding: 15px; color: #373737;
        }

        #hero-status { background: #3d2b1f; color: #FFFF55; border: 4px solid #000; margin-bottom: 10px; }
        #hero-name { font-size: 2em; text-shadow: 2px 2px #000; }

        /* 寶箱 CSS */
        #chest-wrapper { width: 100px; height: 80px; margin: 15px auto; position: relative; perspective: 1000px; }
        .chest-body { width: 100%; height: 60%; background: #7d5026; position: absolute; bottom: 0; border: 4px solid #3d2b1f; }
        .chest-lid { width: 100%; height: 45%; background: #96612e; position: absolute; top: 0; border: 4px solid #3d2b1f; transform-origin: top; transition: 0.4s; z-index: 2; }
        .chest-latch { width: 15px; height: 20px; background: #f1c40f; position: absolute; left: 50%; top: 35%; transform: translateX(-50%); border: 2px solid #3d2b1f; }
        .is-open .chest-lid { transform: rotateX(-110deg); }

        .word-display { font-size: 3em; letter-spacing: 10px; margin: 10px 0; color: #000; text-shadow: 1px 1px #fff; }

        /* 鍵盤樣式 */
        .key-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
        .key {
            width: 38px; height: 45px; background: #8b8b8b; color: white;
            border: 3px solid #000; border-top-color: #dbdbdb; border-left-color: #dbdbdb;
            font-size: 1.4em; font-family: 'VT323'; cursor: pointer;
        }
        .key.correct { background: #55ff55; color: #000; }
        .key.wrong { background: #ff5555; animation: shake 0.2s; }
        .key.hidden { visibility: hidden; }

        /* 背包 (Inventory) 樣式 */
        #inventory-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #c6c6c6; border-top: 4px solid #373737;
            padding: 10px 0; max-height: 120px; overflow-y: auto; z-index: 1000;
        }
        .inv-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 600px; margin: 0 auto;
        }
        .inv-slot {
            width: 50px; height: 50px; background: #8b8b8b; border: 3px solid #373737;
            display: flex; align-items: center; justify-content: center; position: relative;
            font-size: 1.5em; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }
        .inv-count {
            position: absolute; bottom: 2px; right: 2px; font-size: 0.6em; background: #373737; color: #fff; padding: 0 2px;
        }

        .action-btn { padding: 8px 15px; font-size: 1.2em; border: 3px solid #000; cursor: pointer; color: #fff; margin: 0 5px; }
        .btn-speak { background: #f1c40f; color: #000; }
        .btn-hint { background: #9b59b6; }
        .btn-next { background: #3498db; display: none; }
        #message { font-size: 1.5em; color: #3d2b1f; font-weight: bold; margin: 10px 0; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

<div id="hero-status" class="gui-panel" style="background: #3d2b1f; padding: 5px;">
    <div id="hero-name">Hero Name</div>
    <div style="font-size: 1.2em; color: #55ff55;">XP: <span id="display-xp">0</span></div>
</div>

<div class="gui-panel">
    <div id="chest-wrapper">
        <div class="chest-lid"><div class="chest-latch"></div></div>
        <div class="chest-body"></div>
    </div>
    <div id="word-box" class="word-display">_ _ _ _ _</div>
    <div id="message">Loading Treasure...</div>
    
    <div class="keyboard" id="keyboard"></div>

    <div style="margin-top: 15px;">
        <button class="action-btn btn-speak" onclick="speakWord()">🔊 Hear</button>
        <button class="action-btn btn-hint" onclick="useHint()">💡 Hint</button>
        <button class="action-btn btn-next" id="nextBtn" onclick="initGame()">Next ⏭️</button>
    </div>
</div>

<div id="inventory-container">
    <div style="color: #373737; font-weight: bold; margin-bottom: 5px;">JOVAN'S INVENTORY</div>
    <div class="inv-grid" id="inv-grid"></div>
</div>

<script type="module">
    import { db, doc, setDoc } from './firebase-config.js';

    const wordBank = ["THE", "SAID", "SCHOOL", "HOUSE", "BECAUSE", "FRIEND", "PEOPLE", "WATER", "MONEY", "BEAUTIFUL", "FATHER", "PARENTS", "EVERYBODY", "SHOULD", "WOULD", "COULD"]; // (此處可填滿之前提供的 145 字)

    // 定義物品池
    const rareLoot = [
        { name: "Diamond", icon: "💎" }, { name: "Sword", icon: "⚔️" }, 
        { name: "Shield", icon: "🛡️" }, { name: "Chestplate", icon: "👕" }, 
        { name: "Mage Hat", icon: "🧙‍♂️" }, { name: "Helmet", icon: "🪖" }
    ];
    const commonLoot = [
        { name: "Gold Coin", icon: "🪙" }, { name: "Steak", icon: "🥩" }, 
        { name: "Potion", icon: "🧪" }, { name: "Boots", icon: "👞" }
    ];

    let currentWord = "", guessedLetters = [], wrongCount = 0, heroName = "";

    function initHero() {
        heroName = localStorage.getItem('jovan_hero_name') || "Mystery Explorer";
        document.getElementById('hero-name').innerText = heroName;
        document.getElementById('display-xp').innerText = localStorage.getItem('jovan_total_xp') || 0;
        updateInventoryUI();
    }

    function updateInventoryUI() {
        const inv = JSON.parse(localStorage.getItem('jovan_inventory') || "{}");
        const grid = document.getElementById('inv-grid');
        grid.innerHTML = "";
        
        // 合併顯示所有物品及其 icon
        const allItems = [...rareLoot, ...commonLoot];
        allItems.forEach(item => {
            if (inv[item.name]) {
                grid.innerHTML += `
                    <div class="inv-slot">
                        ${item.icon}
                        <div class="inv-count">${inv[item.name]}</div>
                    </div>
                `;
            }
        });
    }

    async function addGlobalRewards(xpAmt, itemName) {
        let xp = parseInt(localStorage.getItem('jovan_total_xp')) || 0;
        let inv = JSON.parse(localStorage.getItem('jovan_inventory') || "{}");
        
        xp += xpAmt;
        inv[itemName] = (inv[itemName] || 0) + 1;
        
        localStorage.setItem('jovan_total_xp', xp);
        localStorage.setItem('jovan_inventory', JSON.stringify(inv));
        
        document.getElementById('display-xp').innerText = xp;
        updateInventoryUI();

        try { await setDoc(doc(db, "leaderboard", heroName), { name: heroName, xp, inventory: inv, lastUpdate: new Date() }, { merge: true }); } catch (e) {}
    }

    window.initGame = function() {
        initHero();
        currentWord = wordBank[Math.floor(Math.random() * wordBank.length)].toUpperCase();
        guessedLetters = []; wrongCount = 0;
        document.getElementById('chest-wrapper').classList.remove('is-open');
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('message').innerText = "Spell it to open!";
        renderKeyboard(); updateDisplay(); speakWord();
    }

    function renderKeyboard() {
        const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
        document.getElementById('keyboard').innerHTML = rows.map(r => `<div class="key-row">${r.split('').map(c => `<button class="key" id="key-${c}" onclick="guess('${c}')">${c}</button>`).join('')}</div>`).join('');
    }

    function updateDisplay() {
        const display = currentWord.split('').map(c => (guessedLetters.includes(c) || c === " " || c === ".") ? c : "_").join(' ');
        document.getElementById('word-box').innerText = display;
        if (!display.includes("_")) gameWin();
    }

    window.guess = function(char) {
        if (guessedLetters.includes(char)) return;
        if (currentWord.includes(char)) {
            guessedLetters.push(char); document.getElementById(`key-${char}`).classList.add('correct'); updateDisplay();
        } else {
            wrongCount++; document.getElementById(`key-${char}`).classList.add('wrong');
            document.getElementById('message').innerText = "Wrong key! *Clank*";
        }
    }

    window.useHint = function() {
        document.querySelectorAll('.key').forEach(b => { if(!currentWord.includes(b.innerText)) b.classList.add('hidden'); });
    }

    window.speakWord = function() { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(currentWord.toLowerCase()); m.lang = 'en-GB'; m.rate = 0.8; window.speechSynthesis.speak(m); }

    function gameWin() {
        document.getElementById('chest-wrapper').classList.add('is-open');
        let itemDropped;
        let winText = "";

        if (wrongCount === 0) {
            itemDropped = rareLoot[Math.floor(Math.random() * rareLoot.length)];
            winText = `Perfect, ${heroName}! Found: ${itemDropped.name}`;
        } else {
            itemDropped = commonLoot[Math.floor(Math.random() * commonLoot.length)];
            winText = `Well done, ${heroName}! Got: ${itemDropped.name}`;
        }

        document.getElementById('message').innerText = winText;
        document.getElementById('nextBtn').style.display = 'inline-block';
        addGlobalRewards(2, itemDropped.name);

        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(winText);
        m.lang = 'en-GB'; window.speechSynthesis.speak(m);
    }

    window.onload = initGame;
</script>
</body>
</html>
