<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jovan's Spelling Quest: Gold Merchant</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-dirt: #5c3c21;
            --mc-gui: #c6c6c6;
            --mc-border-dark: #373737;
            --mc-border-light: #ffffff;
            --mc-stone: #8b8b8b;
        }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--mc-dirt);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            color: white; text-align: center; padding: 10px; margin: 0;
            image-rendering: pixelated; touch-action: manipulation;
        }

        .gui-panel {
            background-color: var(--mc-gui);
            border: 4px solid var(--mc-border-dark);
            border-right-color: var(--mc-border-light);
            border-bottom-color: var(--mc-border-light);
            box-shadow: inset 4px 4px 0px var(--mc-border-light), inset -4px -4px 0px var(--mc-border-dark);
            max-width: 850px; margin: 5px auto; padding: 15px; color: #373737;
        }

        #hero-status { background: #3d2b1f; color: #FFFF55; border: 4px solid #000; margin-bottom: 10px; padding: 10px; }
        #hero-name { font-size: 2em; text-shadow: 2px 2px #000; }

        /* 像素寶箱 */
        #chest-wrapper { width: 120px; height: 90px; margin: 15px auto; position: relative; perspective: 1000px; }
        .chest-body { width: 100%; height: 60%; background: #7d5026; position: absolute; bottom: 0; border: 5px solid #3d2b1f; }
        .chest-lid { width: 100%; height: 50%; background: #96612e; position: absolute; top: 0; border: 5px solid #3d2b1f; transform-origin: top; transition: 0.4s; z-index: 2; }
        .chest-latch { width: 20px; height: 25px; background: #f1c40f; position: absolute; left: 50%; top: 35%; transform: translateX(-50%); border: 3px solid #3d2b1f; }
        .is-open .chest-lid { transform: rotateX(-110deg); }

        .word-display { font-size: 3.8em; letter-spacing: 12px; margin: 15px 0; color: #000; font-weight: bold; min-height: 1.2em; }

        /* iPad 鍵盤 */
        .keyboard { display: flex; flex-direction: column; gap: 10px; max-width: 95%; margin: 15px auto; }
        .key-row { display: flex; justify-content: center; gap: 8px; }
        .key {
            min-width: 58px; height: 68px; background: var(--mc-stone); color: white;
            border: 4px solid #000; border-top-color: #dbdbdb; border-left-color: #dbdbdb;
            font-size: 2em; font-family: 'VT323'; cursor: pointer; transition: transform 0.05s;
        }
        .key:active { transform: translateY(4px); background: #5a5a5a; border-top-color: #373737; }
        .key.correct { background: #55ff55; color: #000; border-color: #008000; }
        .key.wrong { background: #ff5555; animation: shake 0.2s; border-color: #800000; }
        .key.hidden { visibility: hidden; pointer-events: none; }

        /* 背包 Inventory - 橫向滾動 */
        #inventory-container {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #c6c6c6; border-top: 6px solid #373737;
            padding: 5px 0; height: 95px; z-index: 1000; overflow: hidden;
        }
        #inventory-title { color: #373737; font-weight: bold; margin-bottom: 5px; font-size: 1.1em; }
        .inv-grid { display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 5px 15px; gap: 10px; -webkit-overflow-scrolling: touch; }
        .inv-grid::-webkit-scrollbar { display: none; }
        .inv-slot {
            flex: 0 0 55px; width: 55px; height: 55px; background: #8b8b8b; border: 4px solid #373737;
            display: flex; align-items: center; justify-content: center; position: relative;
            font-size: 2em; box-shadow: inset 4px 4px 6px rgba(0,0,0,0.5); cursor: pointer;
        }
        .inv-count { position: absolute; bottom: 2px; right: 2px; font-size: 0.5em; background: #373737; color: #fff; padding: 1px 4px; }

        .action-btn { padding: 12px 25px; font-size: 1.6em; border: 4px solid #000; cursor: pointer; color: #fff; margin: 5px; }
        .btn-speak { background: #f1c40f; color: #000; }
        .btn-hint { background: #9b59b6; }
        .btn-next { background: #3498db; display: none; }
        #message { font-size: 1.8em; color: #3d2b1f; font-weight: bold; margin: 10px 0; height: 1.2em; }
    </style>
</head>
<body>

<div id="hero-status" class="gui-panel">
    <div id="hero-name">Loading Explorer...</div>
    <div style="font-size: 1.4em; display: flex; justify-content: center; gap: 25px;">
        <span style="color: #55ff55;">XP: <span id="display-xp">0</span></span>
        <span style="color: #f1c40f;">🟡: <span id="gold-total">0</span></span>
    </div>
</div>

<div class="gui-panel" style="margin-bottom: 110px;">
    <div id="chest-wrapper">
        <div class="chest-lid"><div class="chest-latch"></div></div>
        <div class="chest-body"></div>
    </div>
    <div id="word-box" class="word-display">_ _ _ _ _</div>
    <div id="message">Unlock the loot!</div>
    <div class="keyboard" id="keyboard"></div>
    <div style="margin-top: 15px;">
        <button class="action-btn btn-speak" onclick="speakWord()">🔊 Hear</button>
        <button class="action-btn btn-hint" onclick="useHint()">💡 Hint</button>
        <button class="action-btn btn-next" id="nextBtn" onclick="initGame()">Next ⏭️</button>
    </div>
</div>

<div id="inventory-container">
    <div id="inventory-title">🎒 INVENTORY (TAP TO SELL)</div>
    <div class="inv-grid" id="inv-grid"></div>
</div>

<script type="module">
    import { db, doc, setDoc } from './firebase-config.js';

    // 完整的 170+ 字庫
    const wordBank = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY", "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER", "SPRING", "SUMMER", "AUTUMN", "WINTER", "ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX", "SEVEN", "EIGHT", "NINE", "TEN", "HUNDRED", "THOUSAND", "UP", "DOWN", "LEFT", "RIGHT", "BIG", "SMALL", "MANY", "FEW", "PERSON", "MOUTH", "HAND", "FOOT", "EYE", "EAR", "HEART", "HEAD", "MOUNTAIN", "WATER", "WOOD", "SOIL", "SUN", "MOON", "SKY", "FIRE", "WIND", "RAIN", "ELECTRICITY", "DAD", "MOM", "BROTHER", "SISTER", "MAN", "WOMAN", "OLD", "YOUNG", "TEACHER", "STUDENT", "FRIEND", "PARK", "GRANDMA", "SCHOOL", "HOME", "DOOR", "WINDOW", "BED", "CHAIR", "TABLE", "LAMP", "PEN", "BOOK", "PAPER", "DRAW", "SING", "FLOWER", "GRASS", "TREE", "LEAF", "FRUIT", "RICE", "MEAT", "BEAN", "COW", "SHEEP", "HORSE", "CHICKEN", "DOG", "CAT", "FISH", "BIRD", "MIDDLE", "COUNTRY", "HONG KONG", "EXIT", "ENTER", "OPEN", "CLOSE", "COME", "GO", "SIT", "STAND", "WALK", "RUN", "JUMP", "FLY", "LISTEN", "SPEAK", "READ", "WRITE", "LOOK", "SEE", "EARLY", "NOON", "LATE", "RED", "YELLOW", "BLUE", "GREEN", "WHITE", "BLACK", "GOLD", "I", "FATHER", "MOTHER", "CLOUD", "SINGLE", "CAR", "REST", "STONE", "OF", "IS", "BALL", "DO", "CAN", "THEM", "POWER", "JADE", "KING", "BRIGHT", "ANCIENT", "CLOTHES", "BOW", "TOWEL", "EARTH", "THE", "SAID", "SAYS", "ARE", "WERE", "WAS", "HIS", "HAS", "YOU", "YOUR", "THEY", "BE", "HE", "ME", "SHE", "WE", "NO", "SO", "BY", "MY", "HERE", "THERE", "WHERE", "LOVE", "COME", "SOME", "ONCE", "ASK", "PUT", "PUSH", "PULL", "FULL", "HOUSE", "OUR", "EVERYBODY", "EVEN", "GREAT", "BREAK", "STEAK", "PRETTY", "BEAUTIFUL", "AFTER", "FAST", "LAST", "PAST", "CLASS", "GRASS", "PASS", "PLANT", "PATH", "BATH", "HOUR", "MOVE", "PROVE", "IMPROVE", "SURE", "SUGAR", "WHO", "WHOLE", "ANY", "BUSY", "PEOPLE", "AGAIN", "HALF", "MONEY", "MR", "MRS", "PARENTS", "FLOOR", "POOR", "BECAUSE", "FIND", "KIND", "MIND", "BEHIND", "CHILD", "CHILDREN", "WILD", "CLIMB", "MOST", "ONLY", "BOTH", "COLD", "HOLD", "TOLD", "EVERY"];

    const rarePool = [
        { name: "Diamond", icon: "💎", price: 30 }, { name: "Diamond Sword", icon: "⚔️", price: 30 }, 
        { name: "Shield", icon: "🛡️", price: 30 }, { name: "Armor", icon: "👕", price: 30 }, 
        { name: "Wizard Hat", icon: "🧙‍♂️", price: 30 }, { name: "Helmet", icon: "🪖", price: 30 },
        { name: "Bow", icon: "🏹", price: 30 }, { name: "Golden Apple", icon: "🍎", price: 30 }
    ];
    // 使用 Coal 替代原本的 Gold Coin 戰利品
    const commonPool = [
        { name: "Coal", icon: "⬛", price: 10 }, { name: "Steak", icon: "🥩", price: 10 }, 
        { name: "Potion", icon: "🧪", price: 10 }, { name: "Boots", icon: "👞", price: 10 }, 
        { name: "Stick", icon: "🥢", price: 10 }, { name: "Bread", icon: "🍞", price: 10 }
    ];

    let currentWord = "", guessedLetters = [], wrongCount = 0, heroName = "";

    function initHero() {
        heroName = localStorage.getItem('jovan_hero_name') || "Mystery Explorer";
        document.getElementById('hero-name').innerText = heroName;
        document.getElementById('display-xp').innerText = localStorage.getItem('jovan_total_xp') || 0;
        document.getElementById('inventory-title').innerText = `🎒 ${heroName.toUpperCase()}'S INVENTORY`;
        updateInventoryUI();
    }

    function updateInventoryUI() {
        const inv = JSON.parse(localStorage.getItem('jovan_inventory') || "{}");
        const gold = localStorage.getItem('jovan_gold_coins') || 0;
        const grid = document.getElementById('inv-grid');
        grid.innerHTML = "";
        document.getElementById('gold-total').innerText = gold;

        const allItems = [...rarePool, ...commonPool];
        allItems.forEach(item => {
            if (inv[item.name]) {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                slot.innerHTML = `${item.icon}<div class="inv-count">${inv[item.name]}</div>`;
                slot.onclick = () => sellItem(item.name, item.icon, item.price);
                grid.appendChild(slot);
            }
        });
    }

    window.sellItem = function(name, icon, price) {
        let inv = JSON.parse(localStorage.getItem('jovan_inventory') || "{}");
        if (confirm(`Sell 1x ${icon} ${name} for ${price} Gold Coins?`)) {
            inv[name] -= 1;
            if (inv[name] <= 0) delete inv[name];
            let gold = parseInt(localStorage.getItem('jovan_gold_coins') || 0) + price;
            localStorage.setItem('jovan_inventory', JSON.stringify(inv));
            localStorage.setItem('jovan_gold_coins', gold);
            updateInventoryUI();
            
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(`Sold ${name}. You earned ${price} gold coins.`);
            m.lang = 'en-GB'; m.rate = 0.9;
            window.speechSynthesis.speak(m);
            syncToFirebase();
        }
    };

// 1. 新增：統一加分與週榜紀錄邏輯
    async function addXP(amount) {
        let totalXP = parseInt(localStorage.getItem('jovan_total_xp')) || 0;
        let dailyLog = JSON.parse(localStorage.getItem('jovan_daily_log') || "{}");
        let today = new Date().toISOString().split('T')[0];
        
        // 紀錄今日得分
        dailyLog[today] = (dailyLog[today] || 0) + amount;
        
        // 計算週榜總分 (Rolling 7 Days)
        let weeklyXP = 0;
        for (let i = 0; i < 7; i++) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            let dateStr = d.toISOString().split('T')[0];
            if (dailyLog[dateStr]) weeklyXP += dailyLog[dateStr];
        }

        // 更新 Local
        totalXP += amount;
        localStorage.setItem('jovan_total_xp', totalXP);
        localStorage.setItem('jovan_daily_log', JSON.stringify(dailyLog));
        
        // 更新畫面上嘅 XP 顯示
        const xpDisp = document.getElementById('display-xp');
        if (xpDisp) xpDisp.innerText = totalXP;

        // 呼叫同步 (傳送最新數據)
        await syncToFirebase(totalXP, weeklyXP);
    }

    // 2. 修改：同步函數 (加入 weeklyXP 欄位)
    async function syncToFirebase(passedXp, passedWeeklyXp) {
        // 如果係由 sellItem 呼叫，可能冇傳入 XP，呢度做返個 fallback
        const xp = passedXp || localStorage.getItem('jovan_total_xp') || 0;
        const gold = localStorage.getItem('jovan_gold_coins') || 0;
        const inv = JSON.parse(localStorage.getItem('jovan_inventory') || "{}");
        
        // 如果冇傳入 weeklyXP，即場計返一次
        let weeklyXP = passedWeeklyXp;
        if (weeklyXP === undefined) {
            let dailyLog = JSON.parse(localStorage.getItem('jovan_daily_log') || "{}");
            weeklyXP = 0;
            for (let i = 0; i < 7; i++) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let dateStr = d.toISOString().split('T')[0];
                if (dailyLog[dateStr]) weeklyXP += dailyLog[dateStr];
            }
        }

        try {
            await setDoc(doc(db, "leaderboard", heroName), {
                name: heroName,
                xp: parseInt(xp),
                weeklyXP: parseInt(weeklyXP),
                inventory: inv,
                goldCoins: parseInt(gold),
                lastUpdate: new Date()
            }, { merge: true });
            console.log("Spelling Quest Cloud Sync Success!");
        } catch (e) { console.error("Cloud Sync Error:", e); }
    }

    window.initGame = function() {
        initHero();
        currentWord = wordBank[Math.floor(Math.random() * wordBank.length)].toUpperCase();
        guessedLetters = []; wrongCount = 0;
        document.getElementById('chest-wrapper').className = "";
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('message').innerText = "Spell to trade for loot!";
        renderKeyboard(); updateDisplay(); speakWord();
    }

    function renderKeyboard() {
        const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
        document.getElementById('keyboard').innerHTML = rows.map(r => `<div class="key-row">${r.split('').map(c => `<button class="key" id="key-${c}" onclick="guess('${c}')">${c}</button>`).join('')}</div>`).join('');
    }

    function updateDisplay() {
        const display = currentWord.split('').map((c, i) => (guessedLetters.length > i) ? currentWord[i] : ((c === " " || c === ".") ? c : "_")).join(' ');
        document.getElementById('word-box').innerText = display;
        if (!display.includes("_")) gameWin();
    }

    window.guess = function(char) {
        if (document.getElementById('nextBtn').style.display === 'inline-block') return;
        if (char === currentWord[guessedLetters.length]) {
            guessedLetters.push(char); document.getElementById(`key-${char}`).classList.add('correct'); updateDisplay();
        } else {
            wrongCount++; document.getElementById(`key-${char}`).classList.add('wrong');
            document.getElementById('message').innerText = "Clank! The lock is stuck.";
        }
    }

    window.useHint = function() {
        const remaining = currentWord.split('').slice(guessedLetters.length);
        document.querySelectorAll('.key').forEach(b => { if(!remaining.includes(b.innerText)) b.classList.add('hidden'); });
    }

    window.speakWord = function() {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(currentWord.toLowerCase());
        m.lang = 'en-GB'; m.rate = 0.8; window.speechSynthesis.speak(m);
    }

// 3. 修改：gameWin 函數 (用新嘅 addXP 取代舊有邏輯)
    function gameWin() {
        const wrapper = document.getElementById('chest-wrapper');
        wrapper.classList.add('is-open');
        let item = (wrongCount === 0) ? rarePool[Math.floor(Math.random() * rarePool.length)] : commonPool[Math.floor(Math.random() * commonPool.length)];
        let winText = (wrongCount === 0) ? `Perfect, ${heroName}` : `Well done, ${heroName}`;
        document.getElementById('message').innerText = `${winText}! Got ${item.icon}`;
        document.getElementById('nextBtn').style.display = 'inline-block';
        
        // --- 重點改動：用 addXP 處理加分同週榜紀錄 ---
        addXP(2); 
        
        // 更新背包
        let inv = JSON.parse(localStorage.getItem('jovan_inventory') || "{}");
        inv[item.name] = (inv[item.name] || 0) + 1;
        localStorage.setItem('jovan_inventory', JSON.stringify(inv));
        
        updateInventoryUI();
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(`${winText}. You found a ${item.name}.`));
        // 注意：呢度唔使再手動 call syncToFirebase，因為 addXP 已經做咗
    }

    window.onload = initGame;
</script>
</body>
</html>
