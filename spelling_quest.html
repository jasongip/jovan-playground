<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jovan's Spelling Quest: Minecraft Chest</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #2c3e50; color: white; text-align: center; padding: 10px; overflow: hidden;
            touch-action: manipulation;
        }

        #hero-status {
            background: #3d2b1f; border: 4px solid #1a120c; border-radius: 10px;
            max-width: 600px; margin: 0 auto 10px; padding: 12px; box-shadow: 0 6px 0 #000;
        }

        /* Minecraft 像素寶箱 CSS */
        #chest-wrapper {
            width: 120px; height: 100px; margin: 20px auto; position: relative; perspective: 1000px;
        }
        .chest-body {
            width: 100%; height: 60%; background: #7d5026; position: absolute; bottom: 0;
            border: 6px solid #3d2b1f; box-sizing: border-box;
        }
        .chest-lid {
            width: 100%; height: 45%; background: #96612e; position: absolute; top: 0;
            border: 6px solid #3d2b1f; box-sizing: border-box; transform-origin: top;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2;
        }
        .chest-latch {
            width: 20px; height: 25px; background: #f1c40f; position: absolute;
            left: 50%; top: 35%; transform: translateX(-50%); border: 3px solid #3d2b1f; z-index: 3;
        }
        /* 寶箱狀態 */
        .is-opening .chest-lid { transform: rotateX(-30deg); }
        .is-open .chest-lid { transform: rotateX(-110deg); }
        .perfect-glow {
            position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #55FFFF 0%, transparent 70%);
            opacity: 0; transition: 0.5s; top: -20px; z-index: 1;
        }
        .is-open.perfect .perfect-glow { opacity: 1; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        .word-display {
            font-size: 3.5em; letter-spacing: 12px; margin: 15px 0;
            color: #55FF55; text-shadow: 3px 3px #000; min-height: 1.2em;
        }

        .keyboard { display: flex; flex-direction: column; gap: 8px; max-width: 700px; margin: 0 auto; }
        .key-row { display: flex; justify-content: center; gap: 5px; }
        .key {
            width: 42px; height: 52px; background: #ecf0f1; color: #2c3e50;
            border: 3px solid #7f8c8d; border-radius: 6px; font-size: 1.5em; font-weight: bold;
        }
        .key.correct { background: #2ecc71; color: white; border-color: #27ae60; }
        .key.wrong { background: #e74c3c; color: white; border-color: #c0392b; animation: shake 0.2s; }
        .key.hidden { visibility: hidden; pointer-events: none; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        #inventory-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #3d2b1f;
            border-top: 4px solid #f1c40f; padding: 10px 0; display: flex; justify-content: center;
            gap: 15px; font-size: 1.8em; color: #f1c40f; z-index: 1000;
        }

        .action-btn { padding: 10px 20px; font-size: 1.5em; font-family: 'VT323', monospace; border: 4px solid #000; cursor: pointer; color: white; }
        .btn-speak { background: #f1c40f; color: black; }
        .btn-hint { background: #9b59b6; }
        .btn-next { background: #3498db; display: none; }
        #message { font-size: 1.8em; color: #FFFF55; min-height: 1.5em; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

<div id="hero-status">
    <div id="hero-name">Loading...</div>
    <div class="global-xp-display">TOTAL XP: <span id="display-xp">0</span></div>
</div>

<div id="chest-wrapper">
    <div class="perfect-glow"></div>
    <div class="chest-lid"><div class="chest-latch"></div></div>
    <div class="chest-body"></div>
</div>

<div id="word-box" class="word-display">_ _ _ _ _</div>
<div id="message">Unlock the loot!</div>

<div class="keyboard" id="keyboard"></div>

<div class="btn-group" style="margin-bottom: 70px; margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
    <button class="action-btn btn-speak" onclick="speakWord()">🔊 Hear</button>
    <button class="action-btn btn-hint" onclick="useHint()">💡 Hints</button>
    <button class="action-btn btn-next" id="nextBtn" onclick="initGame()">Next ⏭️</button>
</div>

<div id="inventory-bar">
    <span>💎 TREASURY:</span>
    <span id="diamond-total">0</span>
</div>

<script type="module">
    import { db, doc, setDoc } from './firebase-config.js';

    const wordBank = [
        "THE", "A", "DO", "TO", "TODAY", "OF", "SAID", "SAYS", "ARE", "WERE", "WAS", "IS", "HIS", "HAS", "I", "YOU", "YOUR", "THEY", "BE", "HE", "ME", "SHE", "WE", "NO", "GO", "SO", "BY", "MY", "HERE", "THERE", "WHERE", "LOVE", "COME", "SOME", "ONE", "ONCE", "ASK", "FRIEND", "SCHOOL", "PUT", "PUSH", "PULL", "FULL", "HOUSE", "OUR",
        "EVERYBODY", "EVEN", "GREAT", "BREAK", "STEAK", "PRETTY", "BEAUTIFUL", "AFTER", "FAST", "LAST", "PAST", "FATHER", "CLASS", "GRASS", "PASS", "PLANT", "PATH", "BATH", "HOUR", "MOVE", "PROVE", "IMPROVE", "SURE", "SUGAR", "EYE", "COULD", "SHOULD", "WOULD", "WHO", "WHOLE", "ANY", "MANY", "CLOTHES", "BUSY", "PEOPLE", "WATER", "AGAIN", "HALF", "MONEY", "MR", "MRS", "PARENTS", "DOOR", "FLOOR", "POOR", "BECAUSE", "FIND", "KIND", "MIND", "BEHIND", "CHILD", "CHILDREN", "WILD", "CLIMB", "MOST", "ONLY", "BOTH", "OLD", "COLD", "GOLD", "HOLD", "TOLD", "EVERY"
    ];

    let currentWord = "", guessedLetters = [], wrongCount = 0, heroName = "";

    function initHero() {
        heroName = localStorage.getItem('jovan_hero_name') || "Mystery Explorer";
        document.getElementById('hero-name').innerText = heroName;
        document.getElementById('display-xp').innerText = localStorage.getItem('jovan_total_xp') || 0;
        document.getElementById('diamond-total').innerText = localStorage.getItem('jovan_diamonds_total') || 0;
    }

    async function addGlobalRewards(xpAmt, diaAmt) {
        let xp = parseInt(localStorage.getItem('jovan_total_xp')) || 0;
        let dia = parseInt(localStorage.getItem('jovan_diamonds_total')) || 0;
        xp += xpAmt; dia += diaAmt;
        localStorage.setItem('jovan_total_xp', xp);
        localStorage.setItem('jovan_diamonds_total', dia);
        document.getElementById('display-xp').innerText = xp;
        document.getElementById('diamond-total').innerText = dia;
        try { await setDoc(doc(db, "leaderboard", heroName), { name: heroName, xp, diamonds: dia, lastUpdate: new Date() }, { merge: true }); } catch (e) {}
    }

    window.initGame = function() {
        initHero();
        currentWord = wordBank[Math.floor(Math.random() * wordBank.length)].toUpperCase();
        guessedLetters = []; wrongCount = 0;
        const wrapper = document.getElementById('chest-wrapper');
        wrapper.className = ""; // Reset chest state
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('message').innerText = "Unlock the Loot!";
        renderKeyboard(); updateDisplay(); speakWord();
    }

    function renderKeyboard() {
        const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
        document.getElementById('keyboard').innerHTML = rows.map(r => `<div class="key-row">${r.split('').map(c => `<button class="key" id="key-${c}" onclick="guess('${c}')">${c}</button>`).join('')}</div>`).join('');
    }

    function updateDisplay() {
        const display = currentWord.split('').map(c => (guessedLetters.includes(c) || c === " " || c === ".") ? c : "_").join(' ');
        document.getElementById('word-box').innerText = display;
        if (guessedLetters.length > 0) document.getElementById('chest-wrapper').classList.add('is-opening');
        if (!display.includes("_")) gameWin();
    }

    window.guess = function(char) {
        if (guessedLetters.includes(char)) return;
        if (currentWord.includes(char)) {
            guessedLetters.push(char); document.getElementById(`key-${char}`).classList.add('correct'); updateDisplay();
        } else {
            wrongCount++; document.getElementById(`key-${char}`).classList.add('wrong');
            document.getElementById('message').innerText = "Locked! Try again.";
        }
    }

    window.useHint = function() {
        document.querySelectorAll('.key').forEach(b => { if(!currentWord.includes(b.innerText)) b.classList.add('hidden'); });
    }

    window.speakWord = function() { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(currentWord.toLowerCase()); m.lang = 'en-GB'; m.rate = 0.8; window.speechSynthesis.speak(m); }

    function gameWin() {
        const wrapper = document.getElementById('chest-wrapper');
        wrapper.classList.remove('is-opening');
        wrapper.classList.add('is-open');
        
        let winText = "";
        let diaWon = 0;

        if (wrongCount === 0) {
            diaWon = 3;
            wrapper.classList.add('perfect');
            winText = `Perfect, ${heroName}`;
        } else {
            diaWon = 1;
            winText = `Well done, ${heroName}`;
        }

        document.getElementById('message').innerText = winText;
        document.getElementById('nextBtn').style.display = 'inline-block';
        addGlobalRewards(2, diaWon);

        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(winText);
        m.lang = 'en-GB'; window.speechSynthesis.speak(m);
    }

    window.onload = initGame;
</script>
</body>
</html>
