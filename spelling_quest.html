<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jovan's Spelling Quest: Treasure Chest</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'VT323', monospace;
            background-color: #2c3e50;
            color: white; text-align: center; padding: 10px; overflow: hidden;
            touch-action: manipulation;
        }

        #hero-status {
            background: #34495e; border: 4px solid #1a120c; border-radius: 15px;
            max-width: 600px; margin: 0 auto 10px; padding: 12px; box-shadow: 0 6px 0 #000;
        }

        /* 寶箱樣式 */
        #chest-container {
            font-size: 6em; margin: 10px 0; transition: transform 0.3s;
            cursor: default; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }
        .chest-shake { animation: shake 0.3s ease-in-out; }

        .word-display {
            font-size: 3.5em; letter-spacing: 12px; margin: 15px 0;
            color: #55FF55; text-shadow: 3px 3px #000; min-height: 1.2em;
        }

        /* 鍵盤震動 */
        .keyboard { display: flex; flex-direction: column; gap: 8px; max-width: 700px; margin: 0 auto; }
        .key-row { display: flex; justify-content: center; gap: 5px; }
        .key {
            width: 42px; height: 52px; background: #ecf0f1; color: #2c3e50;
            border: 3px solid #7f8c8d; border-radius: 6px; font-size: 1.5em;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .key.correct { background: #2ecc71; color: white; border-color: #27ae60; }
        .key.wrong { background: #e74c3c; color: white; border-color: #c0392b; animation: shake 0.2s; }
        .key.hidden { visibility: hidden; pointer-events: none; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        /* 底部鑽石庫房 */
        #inventory-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.8); border-top: 4px solid #f1c40f;
            padding: 8px 0; display: flex; justify-content: center; align-items: center;
            gap: 15px; font-size: 1.8em; color: #f1c40f; z-index: 1000;
        }

        .btn-group { margin: 20px 0 60px; display: flex; justify-content: center; gap: 12px; }
        .action-btn {
            padding: 8px 18px; font-size: 1.4em; font-family: 'VT323', monospace;
            border: 4px solid #000; cursor: pointer; color: white;
        }
        .btn-speak { background: #f1c40f; color: black; }
        .btn-hint { background: #9b59b6; }
        .btn-next { background: #3498db; display: none; }
        #message { font-size: 1.5em; color: #FFFF55; min-height: 1.5em; }
    </style>
</head>
<body>

<div id="hero-status">
    <div id="hero-name">Loading Explorer...</div>
    <div class="global-xp-display">TOTAL XP: <span id="display-xp">0</span></div>
</div>

<div id="chest-container">📦</div>

<div id="word-box" class="word-display">_ _ _ _ _</div>
<div id="message">Find the treasure!</div>

<div class="keyboard" id="keyboard"></div>

<div class="btn-group">
    <button class="action-btn btn-speak" onclick="speakWord()">🔊 Hear</button>
    <button class="action-btn btn-hint" onclick="useHint()">💡 Hints</button>
    <button class="action-btn btn-next" id="nextBtn" onclick="initGame()">Next Treasure ⏭️</button>
</div>

<div id="inventory-bar">
    <span>MY TREASURY:</span>
    <span id="diamond-total">0</span>
    <span>💎</span>
</div>

<script type="module">
    import { db, doc, setDoc } from './firebase-config.js';

    const wordBank = [
        "THE", "A", "DO", "TO", "TODAY", "OF", "SAID", "SAYS", "ARE", "WERE", "WAS", "IS", "HIS", "HAS", "I", "YOU", "YOUR", "THEY", "BE", "HE", "ME", "SHE", "WE", "NO", "GO", "SO", "BY", "MY", "HERE", "THERE", "WHERE", "LOVE", "COME", "SOME", "ONE", "ONCE", "ASK", "FRIEND", "SCHOOL", "PUT", "PUSH", "PULL", "FULL", "HOUSE", "OUR",
        "EVERYBODY", "EVEN", "GREAT", "BREAK", "STEAK", "PRETTY", "BEAUTIFUL", "AFTER", "FAST", "LAST", "PAST", "FATHER", "CLASS", "GRASS", "PASS", "PLANT", "PATH", "BATH", "HOUR", "MOVE", "PROVE", "IMPROVE", "SURE", "SUGAR", "EYE", "COULD", "SHOULD", "WOULD", "WHO", "WHOLE", "ANY", "MANY", "CLOTHES", "BUSY", "PEOPLE", "WATER", "AGAIN", "HALF", "MONEY", "MR", "MRS", "PARENTS", "DOOR", "FLOOR", "POOR", "BECAUSE", "FIND", "KIND", "MIND", "BEHIND", "CHILD", "CHILDREN", "WILD", "CLIMB", "MOST", "ONLY", "BOTH", "OLD", "COLD", "GOLD", "HOLD", "TOLD", "EVERY"
    ];

    let currentWord = "";
    let guessedLetters = [];
    let wrongCount = 0;
    let heroName = "";

    function initHero() {
        heroName = localStorage.getItem('jovan_hero_name') || "Mystery Explorer";
        document.getElementById('hero-name').innerText = heroName;
        document.getElementById('display-xp').innerText = localStorage.getItem('jovan_total_xp') || 0;
        document.getElementById('diamond-total').innerText = localStorage.getItem('jovan_diamonds_total') || 0;
    }

    async function addGlobalRewards(xpAmt, diamondAmt) {
        let currentXP = parseInt(localStorage.getItem('jovan_total_xp')) || 0;
        let totalDiamonds = parseInt(localStorage.getItem('jovan_diamonds_total')) || 0;
        
        currentXP += xpAmt;
        totalDiamonds += diamondAmt;
        
        localStorage.setItem('jovan_total_xp', currentXP);
        localStorage.setItem('jovan_diamonds_total', totalDiamonds);
        
        document.getElementById('display-xp').innerText = currentXP;
        document.getElementById('diamond-total').innerText = totalDiamonds;

        try {
            await setDoc(doc(db, "leaderboard", heroName), {
                name: heroName, 
                xp: currentXP, 
                diamonds: totalDiamonds, 
                lastUpdate: new Date()
            }, { merge: true });
        } catch (e) { console.error("Sync Error", e); }
    }

    window.initGame = function() {
        initHero();
        currentWord = wordBank[Math.floor(Math.random() * wordBank.length)].toUpperCase();
        guessedLetters = [];
        wrongCount = 0;
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('message').innerText = "Unlock the chest!";
        document.getElementById('chest-container').innerText = "📦";
        renderKeyboard();
        updateDisplay();
        speakWord();
    }

    function renderKeyboard() {
        const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
        const kb = document.getElementById('keyboard');
        kb.innerHTML = rows.map(row => `
            <div class="key-row">${row.split('').map(c => `
                <button class="key" id="key-${c}" onclick="guess('${c}')">${c}</button>
            `).join('')}</div>`).join('');
    }

    function updateDisplay() {
        const wordArr = currentWord.split('');
        const display = wordArr.map(char => 
            (guessedLetters.includes(char) || char === " " || char === ".") ? char : "_"
        ).join(' ');
        document.getElementById('word-box').innerText = display;

        // 寶箱動態開啟
        const correctCount = wordArr.filter(c => guessedLetters.includes(c)).length;
        const progress = correctCount / wordArr.length;
        const chest = document.getElementById('chest-container');
        
        if (progress > 0 && progress < 1) {
            chest.innerText = "📂"; // 打開少少
        }

        if (!display.includes("_")) {
            gameWin();
        }
    }

    window.guess = function(char) {
        if (guessedLetters.includes(char)) return;
        const keyBtn = document.getElementById(`key-${char}`);
        
        if (currentWord.includes(char)) {
            guessedLetters.push(char);
            keyBtn.classList.add('correct');
            updateDisplay();
        } else {
            wrongCount++;
            keyBtn.classList.add('wrong');
            document.getElementById('chest-container').classList.add('chest-shake');
            setTimeout(() => document.getElementById('chest-container').classList.remove('chest-shake'), 300);
            document.getElementById('message').innerText = "Oops! The chest is locked tight!";
        }
    }

    window.useHint = function() {
        const letters = currentWord.split('');
        document.querySelectorAll('.key').forEach(btn => {
            if (!letters.includes(btn.innerText)) btn.classList.add('hidden');
        });
        document.getElementById('message').innerText = "Magical hints revealed!";
    }

    window.speakWord = function() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(currentWord.toLowerCase());
        msg.lang = 'en-GB'; msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }

    function gameWin() {
        const chest = document.getElementById('chest-container');
        let diamondsWon = 0;
        let winText = "";

        if (wrongCount === 0) {
            diamondsWon = 3;
            chest.innerText = "💰"; // 滿滿鑽石
            winText = `PERFECT, ${heroName}! Full of diamonds! 💎💎💎`;
        } else {
            diamondsWon = 1;
            chest.innerText = "🎁"; // 一粒鑽石
            winText = `Great job, ${heroName}! You found a diamond! 💎`;
        }

        document.getElementById('message').innerText = winText;
        document.getElementById('nextBtn').style.display = 'inline-block';
        addGlobalRewards(2, diamondsWon); // XP 固定 +2

        const speech = new SpeechSynthesisUtterance(`${winText}. Well done!`);
        speech.lang = 'en-GB';
        window.speechSynthesis.speak(speech);
    }

    window.onload = initGame;
</script>

</body>
</html>
